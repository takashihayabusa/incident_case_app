<!DOCTYPE html>
<html lang="ja">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>事案編集</title>
    <style>
        body {
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            background: #f4f8fb;
            padding: 20px;
        }

        h1 {
            color: #1f6fd6;
        }

        form {
            background: #ffffff;
            padding: 20px;
            border: 1px solid #ccc;
            max-width: 600px;
        }

        button {
            padding: 8px 16px;
            background: #1f6fd6;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #1558b0;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<h1>事案 編集</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">保存</button>
</form>

<a href="{% url 'home' %}" class="back-link">← 一覧に戻る</a>

</body>
</html>
