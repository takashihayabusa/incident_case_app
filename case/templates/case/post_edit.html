<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>事案 編集</title>
<style>
    body {
        font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
        background: #f4f8fb;
        padding: 20px;
    }

    .container {
        max-width: 800px;
        margin: auto;
        background: #ffffff;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    h1 {
    margin-bottom: 10px;
    color: #1f6fd6;
    }

    .created-at {
    font-size: 13px;
    color: #666;
    margin-bottom: 20px;
    }

    label {
    font-weight: bold;
    display: block;
    margin-top: 15px;
    margin-bottom: 5px;
    }

    input, textarea {
    width: 100%;
    padding: 8px;
    font-size: 14px;
    }

    textarea {
        min-height: 150px;
    }

    .buttons {
    margin-top: 25px;
    display: flex;
    gap: 10px;
    }

    button {
    padding: 10px 18px;
    font-size: 14px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    }

    .save {
    background: #1f6fd6;
    color: #fff;
    }

    .back {
    background: #aaa;
    color: #fff;
    text-decoration: none;
    line-height: 36px;
    padding: 0 16px;
    border-radius: 4px;
    }
</style>
</head>

<body>
<div class="container">
<h1>事案 編集</h1>

<!-- 登録日時は表示のみ -->
<div class="created-at">
    登録日：{{ post.created_at|date:"Y-m-d H:i" }}
</div>

<form method="post">
{% csrf_token %}

<label>タイトル</label>
{{ form.title }}

<label>内容</label>
    {{ form.memo }}

<label>発生日</label>
    {{ form.incident_date }}

<div class="buttons">
    <button type="submit" class="save">更新</button>
    <a href="{% url 'case:home' %}" class="back">戻る</a>
    </div>
</form>
</div>
</body>
</html>
